<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SodiumPay - Secure System</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary: #007AFF; --dark: #0A0E17; --bg: #F8FAFC; --white: #FFFFFF; --error: #FF3B30; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--dark); overflow: hidden; }

        /* LAYOUT PAGES */
        .page { display: none; min-height: 100vh; position: absolute; width: 100%; top: 0; background: var(--bg); }
        .page.active { display: block; animation: slideUp 0.4s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* FORM STYLES */
        .auth-card { padding: 40px 25px; }
        .logo-box { font-size: 28px; font-weight: 800; color: var(--primary); margin-bottom: 30px; text-align: center; }
        .input-box { margin-bottom: 18px; }
        .input-box label { display: block; font-size: 12px; font-weight: 800; margin-bottom: 8px; color: #666; }
        .input-box input { width: 100%; padding: 16px; border-radius: 12px; border: 1.5px solid #DDD; font-size: 14px; transition: 0.3s; }
        .input-box input:focus { border-color: var(--primary); outline: none; }

        .btn-full { width: 100%; background: var(--primary); color: white; padding: 18px; border-radius: 12px; border: none; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        
        /* CUSTOM MODAL (Pengganti Alert) */
        #custom-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center; padding: 20px;
        }
        .modal-box { background: white; padding: 30px; border-radius: 20px; text-align: center; width: 100%; max-width: 320px; }
        .modal-box i { font-size: 50px; color: var(--primary); margin-bottom: 15px; }
        .modal-box button { background: var(--dark); color: white; border: none; padding: 12px 25px; border-radius: 10px; margin-top: 20px; font-weight: 700; width: 100%; }

        /* DASHBOARD (SIMPLE VERSION FOR TESTING) */
        .header { background: var(--primary); padding: 30px 20px 60px; color: white; border-radius: 0 0 30px 30px; }
        .menu-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; padding: 20px; margin-top: -30px; }
        .menu-item { background: white; padding: 15px; border-radius: 15px; text-align: center; box-shadow: 0 5px 10px rgba(0,0,0,0.05); }
        .menu-item i { font-size: 24px; color: var(--primary); margin-bottom: 8px; display: block; }
        .menu-item span { font-size: 10px; font-weight: 700; }
    </style>
</head>
<body>

    <!-- 1. PAGE REGISTER -->
    <div id="page-register" class="page active">
        <div class="auth-card">
            <div class="logo-box">Sodium<span>Pay</span></div>
            <div class="input-box">
                <label>NAMA LENGKAP</label>
                <input type="text" id="reg-name" placeholder="Nama Kamu">
            </div>
            <div class="input-box">
                <label>EMAIL</label>
                <input type="email" id="reg-email" placeholder="email@gmail.com">
            </div>
            <div class="input-box">
                <label>PASSWORD</label>
                <input type="password" id="reg-pass" placeholder="••••••••">
            </div>
            <button class="btn-full" onclick="handleRegister()">DAFTAR</button>
        </div>
    </div>

    <!-- 2. PAGE OTP (SIMULASI) -->
    <div id="page-otp" class="page">
        <div class="auth-card" style="text-align:center;">
            <div class="logo-box">Verifikasi</div>
            <p style="color:#666; margin-bottom:30px;">Masukkan kode OTP yang dikirim ke email kamu</p>
            <div class="input-box">
                <input type="number" id="otp-input" placeholder="0 0 0 0" style="text-align:center; font-size:30px; letter-spacing:10px;">
            </div>
            <button class="btn-full" onclick="handleVerifyOTP()">VERIFIKASI</button>
            <p style="margin-top:20px; font-size:12px; color:var(--primary); font-weight:700;">Kirim Ulang Kode (60s)</p>
        </div>
    </div>

    <!-- 3. PAGE LOGIN -->
    <div id="page-login" class="page">
        <div class="auth-card">
            <div class="logo-box">Sodium<span>Pay</span></div>
            <div class="input-box">
                <label>EMAIL</label>
                <input type="email" id="login-email" placeholder="email@gmail.com">
            </div>
            <div class="input-box">
                <label>PASSWORD</label>
                <input type="password" id="login-pass" placeholder="••••••••">
            </div>
            <button class="btn-full" onclick="handleLogin()">MASUK</button>
        </div>
    </div>

    <!-- 4. PAGE MAIN DASHBOARD -->
    <div id="page-main" class="page">
        <div class="header">
            <p>Saldo Sodium</p>
            <h1 id="user-balance">Rp 1.500.000</h1>
            <p style="margin-top:10px; font-weight:700;">Halo, <span id="user-display">User</span>!</p>
        </div>
        <div class="menu-grid">
            <div class="menu-item" onclick="comingSoon('Top Up Game')"><i class="fas fa-gamepad"></i><span>Game</span></div>
            <div class="menu-item" onclick="comingSoon('Pulsa')"><i class="fas fa-mobile-alt"></i><span>Pulsa</span></div>
            <div class="menu-item" onclick="comingSoon('Listrik')"><i class="fas fa-bolt"></i><span>PLN</span></div>
            <div class="menu-item" onclick="comingSoon('E-Wallet')"><i class="fas fa-wallet"></i><span>Wallet</span></div>
        </div>
    </div>

    <!-- CUSTOM MODAL HTML -->
    <div id="custom-modal">
        <div class="modal-box">
            <i id="modal-icon" class="fas fa-check-circle"></i>
            <h3 id="modal-title">Berhasil!</h3>
            <p id="modal-msg" style="margin-top:10px; color:#666; font-size:14px;"></p>
            <button onclick="closeModal()">Tutup</button>
        </div>
    </div>

    <script>
        // FUNGSI MODAL CUSTOM (Ganti Alert)
        function showModal(title, msg, type = 'success') {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-msg').innerText = msg;
            const icon = document.getElementById('modal-icon');
            if(type === 'error') {
                icon.className = "fas fa-times-circle";
                icon.style.color = "var(--error)";
            } else {
                icon.className = "fas fa-check-circle";
                icon.style.color = "var(--primary)";
            }
            document.getElementById('custom-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('custom-modal').style.display = 'none';
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // LOGIKA DAFTAR
        function handleRegister() {
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;

            if(!name || !email || !pass) {
                showModal('Waduh!', 'Isi semua data dulu bos.', 'error');
                return;
            }

            // SIMPAN DATA KE STORAGE
            localStorage.setItem('user_name', name);
            localStorage.setItem('user_email', email);
            localStorage.setItem('user_pass', pass);

            showModal('Sukses!', 'OTP dikirim ke ' + email);
            setTimeout(() => { showPage('page-otp'); }, 1500);
        }

        // LOGIKA OTP
        function handleVerifyOTP() {
            const otp = document.getElementById('otp-input').value;
            if(otp === "1234") { // Simulasi Kode OTP 1234
                showModal('Berhasil!', 'Akun kamu aktif. Silakan login.');
                setTimeout(() => { showPage('page-login'); }, 1500);
            } else {
                showModal('OTP Salah', 'Coba masukkan kode 1234 (Simulasi)', 'error');
            }
        }

        // LOGIKA LOGIN (ANTI BYPASS)
        function handleLogin() {
            const emailInput = document.getElementById('login-email').value;
            const passInput = document.getElementById('login-pass').value;

            const savedEmail = localStorage.getItem('user_email');
            const savedPass = localStorage.getItem('user_pass');
            const savedName = localStorage.getItem('user_name');

            // PENGECEKAN DATA
            if(emailInput === savedEmail && passInput === savedPass) {
                document.getElementById('user-display').innerText = savedName;
                showModal('Welcome!', 'Berhasil masuk ke SodiumPay');
                setTimeout(() => { showPage('page-main'); }, 1500);
            } else {
                showModal('Gagal Login', 'Email atau Password tidak cocok dengan data daftar!', 'error');
            }
        }

        // FIX TOMBOL DASHBOARD
        function comingSoon(service) {
            showModal('Sabar!', 'Fitur ' + service + ' lagi dibangun sama Han.', 'success');
        }
    </script>
</body>
</html>
